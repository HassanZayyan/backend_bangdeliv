# Reverse proxy di HOST (Ubuntu), DI LUAR Docker & DI LUAR git repo aplikasi.
# Alur: internet -> host nginx (:80/:443, TLS) -> Docker nginx (127.0.0.1:8081)
#                                              \-> Reverb WS  (127.0.0.1:8080)
#
# Pasang: salin ke /etc/nginx/sites-available/adminbangdeliv, lalu
#   ln -s /etc/nginx/sites-available/adminbangdeliv /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Setelah itu jalankan certbot --nginx (lihat runbook); certbot otomatis
# menambah blok listen 443 + sertifikat + redirect 80->443 ke file ini.

server {
    listen 80;
    listen [::]:80;
    server_name adminbangdeliv.my.id www.adminbangdeliv.my.id;

    client_max_body_size 25M;

    # Laravel Reverb (protokol Pusher) — WebSocket di path /app/{key}
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API + panel admin (Laravel di balik Docker nginx)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
